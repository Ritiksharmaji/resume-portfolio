# Applies a project's numbers and "What's new" to the portfolio.
# Triggered by scripts/sync/templates/notify-portfolio.yml in each project repo, which
# counts facts in its own repo and sends them here — this workflow never reads project code.
# To re-run by hand: open the project repo → Actions → Notify portfolio → Run workflow.
name: Sync project

on:
  repository_dispatch:
    types: [project-updated]

# One sync at a time, so two merges never edit projects.json at once.
concurrency:
  group: portfolio-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.event.client_payload.repo }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No AI and no paid services: counts come from the code, "What's new" from merge titles.
      - name: Update numbers and What's new
        run: npx tsx scripts/sync/apply.mts --event "$GITHUB_EVENT_PATH"

      - name: Build the site with the new content
        run: npm run build

      - name: Publish (pull request, merged once the build has passed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then echo "Nothing changed."; exit 0; fi
          read -r slug sha < <(node -e "const s=require('./data/sync-state.json');const k=Object.keys(s).find(k=>k.toLowerCase()===process.env.REPO.toLowerCase());console.log(s[k].slug, s[k].lastSha.slice(0,9))")
          branch="sync/$slug-$sha"
          git config user.name "portfolio-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          git commit -m "Sync $slug from $REPO@$sha"
          git push -u origin "$branch"
          gh pr create --title "Sync $slug from $REPO@$sha" --body-file .sync-summary.md --base main --head "$branch"
          gh pr merge "$branch" --squash --delete-branch
